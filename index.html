<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国历史人物关系查询</title>
<style>
:root{
  --paper:#f6f3ea; --paper2:#fffdf7; --ink:#26241f; --ink2:#5d574c; --ink3:#8b8477;
  --line:#ded6c4; --line2:#eae3d3;
  --red:#a83232; --red-soft:#c96a5e; --blue:#2f5d8a; --gold:#b08d57;
  --shadow:0 1px 3px rgba(60,50,30,.08),0 4px 16px rgba(60,50,30,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Source Han Serif SC","Noto Serif SC","STSong","SimSun","Songti SC",serif;
  background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6;
  overflow:hidden;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d6cdb9;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
#top{
  height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(180deg,#fffdf7,#f6f3ea);
  border-bottom:1px solid var(--line);position:relative;z-index:20;
}
#logo{font-size:19px;font-weight:700;letter-spacing:2px;white-space:nowrap}
#logo small{font-size:11px;font-weight:400;color:var(--ink3);letter-spacing:0;margin-left:6px}
#search{flex:1;max-width:420px;position:relative}
#search input{
  width:100%;padding:7px 30px 7px 11px;border:1px solid var(--line);border-radius:4px;
  background:var(--paper2);outline:none;
}
#search input:focus{border-color:var(--red-soft);box-shadow:0 0 0 2px rgba(168,50,50,.08)}
#search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  cursor:pointer;color:var(--ink3);padding:2px 5px;display:none}
#suggest{
  position:absolute;top:36px;left:0;right:0;background:var(--paper2);border:1px solid var(--line);
  border-radius:4px;box-shadow:var(--shadow);max-height:320px;overflow:auto;display:none;z-index:60;
}
#suggest div{padding:6px 11px;cursor:pointer;border-bottom:1px solid var(--line2)}
#suggest div:last-child{border-bottom:none}
#suggest div:hover,#suggest div.on{background:#f0e9d8}
#suggest .s-meta{color:var(--ink3);font-size:11px;margin-left:6px}
.tabs{display:flex;gap:2px;background:#efe9da;padding:3px;border-radius:5px}
.tabs button{
  padding:5px 13px;border:none;background:transparent;border-radius:3px;cursor:pointer;white-space:nowrap;
}
.tabs button.on{background:var(--paper2);box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--red);font-weight:600}
#stat{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}

/* ---------- 布局 ---------- */
#app{display:flex;height:calc(100% - 54px)}
#side{width:236px;flex:none;border-right:1px solid var(--line);overflow-y:auto;background:var(--paper2)}
#main{flex:1;position:relative;overflow:hidden;min-width:0}
#detail{width:290px;flex:none;border-left:1px solid var(--line);overflow-y:auto;background:var(--paper2)}

.sec{padding:11px 13px;border-bottom:1px solid var(--line2)}
.sec h4{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:var(--ink3);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  padding:3px 9px;border:1px solid var(--line);border-radius:11px;background:var(--paper);
  cursor:pointer;font-size:12px;user-select:none;
  flex:0 0 auto;white-space:nowrap;max-width:100%;
}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
#plist{max-height:none}
.pitem{padding:4px 13px;cursor:pointer;border-left:3px solid transparent;font-size:13px}
.pitem:hover{background:#f3ecdc}
.pitem.on{background:#f0e9d8;border-left-color:var(--red)}
.pitem .pd{color:var(--ink3);font-size:11px}

/* ---------- 视图 ---------- */
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#v-time{overflow-y:auto}
canvas{display:block;width:100%;height:100%}

#gtool{
  position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:center;
  background:rgba(255,253,247,.94);border:1px solid var(--line);border-radius:5px;padding:5px 8px;
  box-shadow:var(--shadow);font-size:12px;z-index:5;
}
#gtool button{border:1px solid var(--line);background:var(--paper2);border-radius:3px;padding:3px 8px;cursor:pointer}
#gtool button:hover{border-color:var(--red-soft);color:var(--red)}
#gtool label{display:flex;align-items:center;gap:4px;color:var(--ink2);cursor:pointer}
#legend{
  position:absolute;right:12px;bottom:12px;background:rgba(255,253,247,.94);border:1px solid var(--line);
  border-radius:5px;padding:8px 10px;box-shadow:var(--shadow);font-size:11px;z-index:5;max-width:220px;
}
#legend b{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:5px;font-size:12px;color:var(--ink2);font-weight:600}
#legend b{cursor:pointer;user-select:none}
#legend b em{font-style:normal;color:var(--ink3);font-weight:400}
#legend span{display:inline-block;margin:2px 8px 2px 0;color:var(--ink2)}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
#legend em{display:inline-block;width:14px;height:2px;margin-right:4px;vertical-align:3px;font-style:normal}

#tip{
  position:fixed;background:rgba(38,36,31,.94);color:#fff;padding:5px 9px;border-radius:4px;
  font-size:12px;pointer-events:none;display:none;z-index:100;max-width:280px;
}
#empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:14px;text-align:center;line-height:2;
}

/* ---------- 关系链 ---------- */
#chain{padding:20px;height:100%;overflow-y:auto}
.chain-box{max-width:900px;margin:0 auto}
.chain-pick{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.chain-pick input{padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper2);width:180px;outline:none}
.chain-pick button{padding:7px 16px;border:1px solid var(--red);background:var(--red);color:#fff;border-radius:4px;cursor:pointer}
.chain-pick button:hover{background:#8f2929}
.path{
  background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px;
  box-shadow:var(--shadow);
}
.path-title{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--red)}
.node-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard{
  border:1px solid var(--line);border-radius:5px;padding:7px 12px;background:var(--paper);cursor:pointer;
  min-width:90px;text-align:center;
}
.pcard:hover{border-color:var(--red);background:#fdf6e6}
.pcard b{display:block;font-size:14px}
.pcard span{font-size:11px;color:var(--ink3)}
.link-mid{color:var(--ink2);font-size:12.5px;padding:4px 2px 4px 14px;line-height:1.5;border-left:2px solid var(--line2);margin:2px 0}
.link-mid:first-of-type{border-left-color:var(--red-soft)}
.link-mid .rt{display:inline-block;background:#efe9da;border-radius:9px;padding:0 8px;color:var(--ink2);font-size:11px;margin-right:6px}
.link-mid b{color:var(--ink);font-weight:600}
.common{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.common .pcard{min-width:70px}

/* ---------- 列表 ---------- */
#list{padding:0;height:100%;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  position:sticky;top:0;background:#f0e9d8;text-align:left;padding:8px 10px;font-weight:600;
  font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:2;
}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:hover td{background:#faf5e8}
td.nm{font-weight:600;color:var(--ink);cursor:pointer}
td.nm:hover{color:var(--red)}
td.yr{color:var(--ink3);font-size:12px;white-space:nowrap}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:12px;color:var(--ink2);font-size:12px}
.pager button{border:1px solid var(--line);background:var(--paper2);border-radius:3px;padding:3px 10px;cursor:pointer}

/* ---------- 详情 ---------- */
#detail .dhead{padding:16px 15px 12px;border-bottom:1px solid var(--line2)}
#detail .dname{font-size:21px;font-weight:700;letter-spacing:1px}
#detail .dalias{color:var(--ink3);font-size:12px;margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{background:#efe9da;border-radius:3px;padding:2px 8px;font-size:11px;color:var(--ink2)}
.tag.era{color:#fff}
#detail .ddesc{padding:12px 15px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line2);line-height:1.8}
#detail .dsec{padding:12px 15px}
#detail h4{margin:0 0 8px;font-size:12px;color:var(--ink3);letter-spacing:1px;font-weight:600}
.rel{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2);align-items:baseline;font-size:12.5px}
.rel:last-child{border-bottom:none}
.rel .rt{flex:none;background:#efe9da;border-radius:9px;padding:1px 7px;font-size:11px;color:var(--ink2)}
.rel .who{color:var(--red);cursor:pointer;font-weight:600;flex:none}
.rel .who:hover{text-decoration:underline}
.rel .ds{color:var(--ink2);flex:1}
.hint{padding:26px 16px;color:var(--ink3);font-size:13px;line-height:2}
@media (max-width:1100px){#detail{display:none}#side{width:190px}}
</style>
</head>
<body>

<div id="top">
  <div id="logo">中国历史人物关系查询<small>图谱 · 关系链 · 年表</small></div>
  <div id="search">
    <input id="q" placeholder="输入姓名 / 别号 / 朝代 / 身份，如：李白、唐宋八大家、女皇" autocomplete="off">
    <span class="clear" id="qc">✕</span>
    <div id="suggest"></div>
  </div>
  <div class="tabs">
    <button data-v="graph" class="on">关系图谱</button>
    <button data-v="chain">关系链</button>
    <button data-v="time">年代长卷</button>
    <button data-v="list">人物库</button>
  </div>
  <div id="stat"></div>
</div>

<div id="app">
  <aside id="side">
    <div class="sec">
      <h4>时代</h4>
      <div class="chips" id="eras"></div>
    </div>
    <div class="sec">
      <h4>关系类型</h4>
      <div class="chips" id="types"></div>
    </div>
    <div class="sec" style="border-bottom:none">
      <h4 id="plabel">人物</h4>
      <div id="plist"></div>
    </div>
  </aside>

  <main id="main">
    <div class="view on" id="v-graph">
      <canvas id="cv"></canvas>
      <div id="gtool">
        <button id="btn-fit">复位</button>
        <button id="btn-expand">聚焦此人</button>
        <button id="btn-all">全景</button>
        <button id="btn-freeze">冻结/继续</button>
        <button id="btn-png">导出图</button>
        <label><input type="checkbox" id="ck-label" checked> 姓名</label>
        <label><input type="checkbox" id="ck-edge" checked> 关系说明</label>
        <label style="gap:5px">间距 <input type="range" id="sp" min="60" max="210" value="100" style="width:74px;vertical-align:-2px"></label>
        <span id="gmode" style="color:var(--ink3)"></span>
      </div>
      <div id="legend">
        <b id="lg-t">图例 <em id="lg-a">▾</em></b>
        <div id="lg-body"><div id="legend-era"></div><div id="legend-rel" style="margin-top:6px"></div></div>
      </div>
      <div id="empty" style="display:none"></div>
    </div>

    <div class="view" id="v-chain">
      <div id="chain">
        <div class="chain-box">
          <div class="chain-pick">
            <input id="ca" placeholder="起点人物，如：李白" autocomplete="off">
            <span style="color:var(--ink3)">→</span>
            <input id="cb" placeholder="终点人物，如：曹操" autocomplete="off">
            <button id="btn-path">查询关系链</button>
            <button id="btn-random" style="background:var(--paper2);color:var(--ink2);border-color:var(--line)">随机一对</button>
          </div>
          <div id="path-out"></div>
        </div>
      </div>
    </div>

    <div class="view" id="v-time">
      <canvas id="cv2"></canvas>
      <div id="tip2" style="position:fixed;display:none;background:rgba(38,36,31,.94);color:#fff;padding:5px 9px;border-radius:4px;font-size:12px;z-index:100;pointer-events:none"></div>
    </div>

    <div class="view" id="v-list">
      <div id="list"><table id="tb"><thead><tr>
        <th data-s="0">姓名</th><th data-s="1">别号</th><th data-s="2">朝代</th><th data-s="3">身份</th>
        <th data-s="4">生卒</th><th>简介</th>
      </tr></thead><tbody></tbody></table><div class="pager" id="pg"></div></div>
    </div>
  </main>

  <aside id="detail"><div class="hint">在左侧或图谱中点选一位人物，查看其生平与关系。<br><br>· 滚轮缩放，拖拽平移<br>· 单击节点查看关系<br>· 双击节点以其为中心展开</div></aside>
</div>

<div id="tip"></div>

 ["先秦",["商","商末周初","西周","春秋","春秋战国","战国"],"#b08d57"],

});
var BY_NAME={};P.forEach(function(p){BY_NAME[p.name]=p;});
var RELS=[];var badRel=[];var _seen={};
DB_R.forEach(function(r){

var NEI=P.map(function(){return new Set();});

/* ---------- 工具 ---------- */
function fmtY(y){return y<0?"前"+(-y):(y+"年");}
function life(p){if(p.b==null&&p.d==null)return "生卒不详";return fmtY(p.b)+" — "+fmtY(p.d);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

/* ---------- 侧栏筛选 ---------- */
function buildFilters(){
  var eh=document.getElementById("eras");
  eh.innerHTML="";
  ERA.forEach(function(e){
    var el=document.createElement("div");
    el.className="chip"+(S.eras.has(e[0])?" on":"");
    el.innerHTML='<span class="dot" style="background:'+e[2]+'"></span>'+e[0];
    el.onclick=function(){
      if(S.eras.has(e[0]))S.eras.delete(e[0]);else S.eras.add(e[0]);
      buildFilters();renderAll();
    };
    eh.appendChild(el);
  });
  var th=document.getElementById("types");
  th.innerHTML="";
  var tset={};RELS.forEach(function(r){tset[r.t]=(tset[r.t]||0)+1;});
  Object.keys(tset).sort(function(a,b){return tset[b]-tset[a];}).forEach(function(t){
    var el=document.createElement("div");
    el.className="chip"+(S.types.has(t)?" on":"");
    el.innerHTML=t+'<span style="color:var(--ink3);font-size:10px"> '+tset[t]+'</span>';
    el.onclick=function(){
      if(S.types.has(t))S.types.delete(t);else S.types.add(t);
      buildFilters();renderAll();
    };

  var lg=document.getElementById("legend-era");

  var lr=document.getElementById("legend-rel");
  lr.innerHTML=Object.keys(REL_COLOR).map(function(t){
    return '<span><em style="background:'+REL_COLOR[t]+'"></em>'+t+'</span>';}).join("");
}

function matchQ(p,q){
  if(!q)return true;
  q=q.toLowerCase();
  return (p.name+p.alias+p.dyn+p.role+p.desc+p.era).toLowerCase().indexOf(q)>=0;
}
function passFilter(p){return (!S.eras.size||S.eras.has(p.era))&&matchQ(p,S.q);}
function passType(t){return !S.types.size||S.types.has(t);}

function renderSideList(){
  var box=document.getElementById("plist");
  var list=P.filter(passFilter);
  list.sort(function(a,b){return a.b-b.b;});
  document.getElementById("plabel").textContent="人物 · "+list.length+(S.q||S.eras.size?"（已筛选）":"");
  var shown=list.slice(0,400);
  box.innerHTML=shown.map(function(p){
    return '<div class="pitem'+(S.sel&&S.sel.i===p.i?" on":"")+'" data-i="'+p.i+'">'+
      esc(p.name)+'<span class="pd"> · '+esc(p.dyn)+(p.alias?" · "+esc(p.alias):"")+'</span></div>';
  }).join("")+(list.length>400?'<div class="pitem" style="color:var(--ink3)">…… 仅显示前 400 位，请用搜索或时代筛选缩小范围</div>':"");
  Array.prototype.forEach.call(box.children,function(el){
    if(el.dataset.i==null)return;
    el.onclick=function(){select(P[+el.dataset.i],true);};
  });
}

/* ---------- 图谱：选节点集合 ---------- */
function buildGraphNodes(){
  var nodes,links;
  if(S.focus){
    // 焦点模式：焦点人物 + 全部直接关系人（受类型筛选限制）
    var set=new Set([S.focus.i]);
    ADJ[S.focus.i].forEach(function(e){if(passType(e.t)){set.add(e.o.i);}});
    // 若筛选后过少，补全焦点两跳内部分节点
    if(set.size<6){ADJ[S.focus.i].forEach(function(e){ADJ[e.o.i].slice(0,8).forEach(function(e2){if(passType(e2.t))set.add(e2.o.i);});});}
    nodes=Array.from(set).map(function(i){return P[i];});
    var ns=new Set(nodes.map(function(p){return p.i;}));
    links=RELS.filter(function(r){return ns.has(r.a.i)&&ns.has(r.b.i)&&passType(r.t);});
  }else{
    nodes=P.filter(passFilter);
    var ns2=new Set(nodes.map(function(p){return p.i;}));
    links=RELS.filter(function(r){return ns2.has(r.a.i)&&ns2.has(r.b.i)&&passType(r.t);});
    // 全量过大时限流：保留度数最高的节点，保证可读性
    if(nodes.length>260){
      nodes.sort(function(a,b){return b.deg-a.deg;});
      nodes=nodes.slice(0,260);
      var ns3=new Set(nodes.map(function(p){return p.i;}));
      links=links.filter(function(r){return ns3.has(r.a.i)&&ns3.has(r.b.i);});
    }
  }
  S.nodes=nodes;S.links=links;
  return nodes.length;
}

/* ---------- 力导向 ---------- */
var G={pos:[],alpha:1,tick:0,raf:null,tx:0,ty:0,scale:1,drag:null,pan:null,hover:null,spread:1,showEdge:true};
function layoutInit(){
  var n=S.nodes.length;
  var W=cv.clientWidth||800,H=cv.clientHeight||600;
  var R=Math.min(W,H)*0.50, GA=2.39996323;
  G.pos=S.nodes.map(function(p,i){
    // 黄金角螺旋：初始即均匀铺开，中心留白，避免起始重叠
    var ang=i*GA, rad=R*(0.30+0.70*Math.sqrt((i+0.6)/Math.max(n,1)));
    return {x:Math.cos(ang)*rad*1.25+(Math.random()-0.5)*6,
            y:Math.sin(ang)*rad*0.92+(Math.random()-0.5)*6,
            vx:0,vy:0,fixed:false,fx:0,fy:0};
  });
  G.alpha=1;G.tick=0;G.scale=1;G.tx=W/2;G.ty=H/2;
  if(S.focus){
    var fi=S.nodes.findIndex(function(p){return p.i===S.focus.i;});
    if(fi>=0){G.pos[fi].x=0;G.pos[fi].y=0;G.pos[fi].fixed=true;}
  }
}
function step(){
  var n=S.nodes.length;if(!n)return;
  var pos=G.pos,links=S.links,idx={};
  S.nodes.forEach(function(p,i){idx[p.i]=i;});
  var alpha=G.alpha, sp=G.spread;
  var REP=3400*sp*sp, LINK=118*sp, K=0.042, GRAV=0.011, DAMP=0.87, CUT=140000;
  // 斥力（含软碰撞，保证节点间有呼吸空间）
  for(var i=0;i<n;i++){
    var a=pos[i],pa=S.nodes[i];
    for(var j=i+1;j<n;j++){
      var b=pos[j],pb=S.nodes[j];
      var dx=b.x-a.x,dy=b.y-a.y;
      var d2=dx*dx+dy*dy;
      if(d2<1){dx=(Math.random()-0.5)*2;dy=(Math.random()-0.5)*2;d2=4;}
      if(d2>CUT)continue;
      var d=Math.sqrt(d2);
      var f=REP/d2;
      var need=radiusOf(pa)+radiusOf(pb)+26;
      if(d<need)f+=(need-d)*0.5;   // 软碰撞
      var fx=dx/d*f,fy=dy/d*f;
      a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
    }
  }
  // 引力（边）
  links.forEach(function(l){
    var ia=idx[l.a.i],ib=idx[l.b.i];
    if(ia==null||ib==null)return;
    var a=pos[ia],b=pos[ib];
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    var f=(d-LINK)*K;
    var fx=dx/d*f,fy=dy/d*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  });
  // 中心引力 + 更新
  for(var m=0;m<n;m++){
    var p=pos[m];
    if(p.fixed){p.x=p.fx;p.y=p.fy;p.vx=p.vy=0;continue;}
    p.vx-=p.x*GRAV;p.vy-=p.y*GRAV;
    p.vx*=DAMP;p.vy*=DAMP;
    p.x+=p.vx*alpha;p.y+=p.vy*alpha;
  }
  G.alpha*=0.990;G.tick++;
}
function radiusOf(p){return 4.6+Math.min(p.deg,24)*0.5+(S.sel&&S.sel.i===p.i?2.6:0);}
function clampNum(v,a,b){return v<a?a:(v>b?b:v);}

function draw(){
  var cvEl=cv,dpr=Math.min(window.devicePixelRatio||1,2);
  var W=cvEl.clientWidth,H=cvEl.clientHeight;
  if(cvEl.width!==W*dpr||cvEl.height!==H*dpr){cvEl.width=W*dpr;cvEl.height=H*dpr;}
  var g=cvEl.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  g.save();
  g.translate(G.tx,G.ty);g.scale(G.scale,G.scale);
  var sc=G.scale;
  var NAll=S.nodes.length;
  // 字号按 1/scale 折算，保证屏幕上的观感始终一致；人多时整体收小一号
  var fsN=(NAll>120?9:12)/sc;        // 姓名标签
  var fsE=(NAll>120?8.5:10.5)/sc;    // 关系说明
  var rankOf={};                     // 节点重要度排名（度数 + 关联度）
  var idxOf={};S.nodes.forEach(function(p,i){idxOf[p.i]=i;});
  var selIdx=S.sel?(idxOf[S.sel.i]==null?-1:idxOf[S.sel.i]):-1;
  var hi=null;
  if(selIdx>=0)hi=new Set([S.sel.i].concat(ADJ[S.sel.i].map(function(e){return e.o.i;})));
  else if(S.focus)hi=new Set([S.focus.i].concat(ADJ[S.focus.i].map(function(e){return e.o.i;})));
  var focusI=selIdx>=0?S.nodes[selIdx].i:((G.hover!=null&&S.nodes[G.hover])?S.nodes[G.hover].i:null);

  /* ---- 边 ---- */
  S.links.forEach(function(l){
    var ia=idxOf[l.a.i],ib=idxOf[l.b.i];
    if(ia==null||ib==null)return;
    var a=G.pos[ia],b=G.pos[ib];
    var active=!hi||(hi.has(l.a.i)&&hi.has(l.b.i));
    var near=focusI!=null&&(l.a.i===focusI||l.b.i===focusI);
    g.strokeStyle=(REL_COLOR[l.t]||"#9a9a9a");
    g.globalAlpha=active?(near?0.95:0.55):0.10;
    g.lineWidth=(near?2.1:(active?1.25:0.8))/Math.max(sc,0.35);
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  });
  g.globalAlpha=1;

  /* ---- 节点 ---- */
  S.nodes.forEach(function(p,i){
    var pos=G.pos[i];
    var on=!hi||hi.has(p.i);
    var isSel=S.sel&&S.sel.i===p.i;
    var isHov=G.hover===i;
    g.globalAlpha=on?1:0.18;
    var r=radiusOf(p);
    if(isSel||isHov){
      g.beginPath();g.arc(pos.x,pos.y,r+6/sc,0,6.2832);
      g.fillStyle="rgba(168,50,50,.10)";g.fill();
    }
    g.beginPath();g.arc(pos.x,pos.y,r,0,6.2832);
    g.fillStyle=p.color;g.fill();
    g.lineWidth=(isSel?2.4:(isHov?1.8:1.1))/Math.max(sc,0.5);
    g.strokeStyle=isSel?"#a83232":(isHov?"#26241f":"rgba(255,255,255,.9)");
    g.stroke();
    if(isSel){
      g.beginPath();g.arc(pos.x,pos.y,r+4.5/sc,0,6.2832);
      g.strokeStyle="rgba(168,50,50,.5)";g.lineWidth=1.4/sc;g.stroke();
    }
  });
  g.globalAlpha=1;

  /* ---- 标签防重叠放置器 ---- */
  var placed=[];
  function free(x,y,w,h,pad){
    pad=pad==null?2:pad;
    var rx=x-w/2,ry=y-h/2,i,q;
    for(i=0;i<placed.length;i++){
      q=placed[i];
      if(!(rx+w+pad<q.x||q.x+q.w+pad<rx||ry+h+pad<q.y||q.y+q.h+pad<ry))return false;
    }
    placed.push({x:rx,y:ry,w:w,h:h});return true;
  }

  /* ---- 姓名标签：先安排核心人物，再安排其余 ---- */
  if(S.showLabel){
    var N=S.nodes.length;
    var order=S.nodes.map(function(p,i){return i;});
    order.sort(function(a,b){
      var pa=S.nodes[a],pb=S.nodes[b];
      var sa=pa.deg*10+((hi&&hi.has(pa.i))?40:0)+((S.sel&&S.sel.i===pa.i)?1e6:0);
      var sb=pb.deg*10+((hi&&hi.has(pb.i))?40:0)+((S.sel&&S.sel.i===pb.i)?1e6:0);
      return sb-sa;
    });
    order.forEach(function(i,k){rankOf[i]=k;});
    order.forEach(function(i){
      var p=S.nodes[i],pos=G.pos[i];
      var on=!hi||hi.has(p.i);
      var isSel=S.sel&&S.sel.i===p.i;
      var isHov=G.hover===i;
      if(!on&&!isSel&&!isHov)return;
      // 人物越多，越只标注核心（排名靠前）者，其余留给悬停查看
      var key=isSel||isHov||(S.focus&&p.i===S.focus.i);
      if(!key){
        if(N>120&&rankOf[i]>=58)return;
        if(N>60&&rankOf[i]>=80)return;
      }
      var fs=isSel?fsN*1.15:(p.deg>=12?fsN:fsN*0.94);
      g.font=(isSel?"bold ":"")+fs+"px 'Source Han Serif SC','STSong',serif";
      var tw=g.measureText(p.name).width,th=fs*1.35,r=radiusOf(p);
      // 八个方位依次尝试
      var cands=[[0,r+th*0.62],[0,-r-th*0.62],[r+tw*0.55+3,0],[-r-tw*0.55-3,0],
                 [r*0.8,r*0.8+th*0.5],[-r*0.8,r*0.8+th*0.5],[r*0.8,-r*0.8-th*0.5],[-r*0.8,-r*0.8-th*0.5]];
      var put=null,q,qp,ddx,ddy,lim;
      var gA=Math.max(24,Math.floor(N*0.5));   // 只避让较重要的节点，边缘小节点可让位
      for(var k=0;k<cands.length;k++){
        var cx=pos.x+cands[k][0],cy=pos.y+cands[k][1];
        var clash=false;
        for(q=0;q<N;q++){
          if(q===i)continue;
          if(rankOf[q]>gA&&!(S.sel&&S.sel.i===S.nodes[q].i)&&G.hover!==q)continue;
          qp=G.pos[q];
          ddx=qp.x-cx;ddy=qp.y-cy;
          lim=radiusOf(S.nodes[q])+th*0.34;
          if(ddx*ddx+ddy*ddy<lim*lim){clash=true;break;}
        }
        if(clash)continue;
        if(free(cx,cy,tw+4,th,1.5)){put=[cx,cy];break;}
      }
      if(!put)return;
      g.globalAlpha=on?1:0.3;
      g.textAlign="center";g.textBaseline="middle";
      g.lineWidth=3.2/Math.max(sc,0.6);
      g.strokeStyle="rgba(250,247,238,.96)";
      g.strokeText(p.name,put[0],put[1]);
      g.fillStyle=isSel?"#a83232":(isHov?"#1f1d18":"#38342c");
      g.fillText(p.name,put[0],put[1]);
    });
    g.globalAlpha=1;
  }

  /* ---- 关系标签：围绕选中 / 悬停的人物，沿线向外铺开，默认只标类型 ---- */
  if(G.showEdge&&focusI!=null&&S.nodes.length<=90){
    var fi=idxOf[focusI];
    if(fi!=null){
      var fc=G.pos[fi],cand=[];
      ADJ[focusI].forEach(function(e){
        if(!passType(e.t))return;
        var ib=idxOf[e.o.i];
        if(ib==null)return;
        var b=G.pos[ib],dx=b.x-fc.x,dy=b.y-fc.y;
        cand.push({dx:dx,dy:dy,e:e,len:dx*dx+dy*dy});
      });
      // 长边优先：标签落在更外层，中心区域保持干净
      cand.sort(function(x,y){return y.len-x.len;});
      g.textAlign="center";g.textBaseline="middle";
      var shown=0,maxShow=13,gA=Math.max(24,Math.floor(NAll*0.5));
      cand.forEach(function(c){
        if(shown>=maxShow)return;
        var isHov=(G.hover!=null&&S.nodes[G.hover]&&S.nodes[G.hover].i===c.e.o.i);
        var t=isHov?(c.e.t+" · "+c.e.d):c.e.t;
        var fs=isHov?fsE*1.1:(NAll>60?8.4/sc:9.2/sc);
        g.font=fs+"px 'Source Han Serif SC','STSong',serif";
        var maxCh=Math.max(10,Math.round(20/Math.max(sc,0.65)));
        if(t.length>maxCh)t=t.slice(0,maxCh-1)+"…";
        var tw=g.measureText(t).width,th=fs*1.5;
        var kk=isHov?0.5:0.68;
        var mx=fc.x+c.dx*kk,my=fc.y+c.dy*kk;
        var tries=[0,-th*1.05,th*1.05,-th*2.1,th*2.1,-th*3.15,th*3.15];
        for(var j=0;j<tries.length;j++){
          var cx=mx+(j>0?(j%2?1:-1)*tw*0.16:0),cy=my+tries[j];
          // 不压住重要节点的圆
          var clash=false;
          for(var q=0;q<NAll;q++){
            if(q===fi)continue;
            if(rankOf[q]>gA&&!(S.sel&&S.sel.i===S.nodes[q].i))continue;
            var qp=G.pos[q],ddx=qp.x-cx,ddy=qp.y-cy,lim=radiusOf(S.nodes[q])+th*0.30;
            if(ddx*ddx+ddy*ddy<lim*lim){clash=true;break;}
          }
          if(clash)continue;
          if(!free(cx,cy,tw+5,th,2))continue;
          g.lineWidth=3.2/Math.max(sc,0.6);
          g.strokeStyle="rgba(250,247,238,.97)";
          g.strokeText(t,cx,cy);
          g.globalAlpha=isHov?1:0.92;
          g.fillStyle=(REL_COLOR[c.e.t]||"#6b6353");
          g.fillText(t,cx,cy);
          g.globalAlpha=1;
          shown++;
          break;
        }
      });
    }
  }
  g.restore();
}
function loop(){
  if(!S.frozen&&G.alpha>0.004&&G.tick<600){step();}
  draw();
  G.raf=requestAnimationFrame(loop);
}

/* ---------- 图谱交互 ---------- */
var cv=document.getElementById("cv");
function toWorld(mx,my){return {x:(mx-G.tx)/G.scale,y:(my-G.ty)/G.scale};}
function pick(mx,my){
  var w=toWorld(mx,my);var best=-1,bd=1e9;
  S.nodes.forEach(function(p,i){
    var pos=G.pos[i];var dx=pos.x-w.x,dy=pos.y-w.y;var d=Math.sqrt(dx*dx+dy*dy);
    var r=radiusOf(p)/Math.max(G.scale,0.4)+4;
    if(d<r&&d<bd){bd=d;best=i;}
  });
  return best;
}
cv.addEventListener("mousedown",function(e){
  var r=cv.getBoundingClientRect();var mx=e.clientX-r.left,my=e.clientY-r.top;
  var i=pick(mx,my);
  if(i>=0){G.drag={i:i,moved:0};G.pos[i].fixed=true;}
  else{G.pan={x:mx,y:my,tx:G.tx,ty:G.ty};}
});
window.addEventListener("mousemove",function(e){
  var r=cv.getBoundingClientRect();
  var mx=e.clientX-r.left,my=e.clientY-r.top;
  if(mx<0||my<0||mx>r.width||my>r.height){if(G.hover!==null){G.hover=null;}return;}
  if(G.drag){
    var w=toWorld(mx,my);
    G.pos[G.drag.i].fx=w.x;G.pos[G.drag.i].fy=w.y;
    G.pos[G.drag.i].x=w.x;G.pos[G.drag.i].y=w.y;
    G.drag.moved++;
    if(G.alpha<0.06)G.alpha=0.06;
  }else if(G.pan){
    G.tx=G.pan.tx+(mx-G.pan.x);G.ty=G.pan.ty+(my-G.pan.y);
  }else{
    var i=pick(mx,my);
    G.hover=i;
    cv.style.cursor=i>=0?"pointer":"grab";
    var tip=document.getElementById("tip");
    if(i>=0){
      var p=S.nodes[i];
      tip.style.display="block";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY+12)+"px";
      tip.innerHTML="<b>"+esc(p.name)+"</b> <span style='opacity:.7'>"+esc(p.dyn)+"·"+esc(p.role)+"</span><br>"+life(p)+"　关联"+p.deg+"人";
    }else{tip.style.display="none";}
  }
});
window.addEventListener("mouseup",function(){
  if(G.drag){G.pos[G.drag.i].fixed=false;G.drag=null;}
  G.pan=null;
});
cv.addEventListener("click",function(e){
  if(G.drag&&G.drag.moved>3)return;
  var r=cv.getBoundingClientRect();var i=pick(e.clientX-r.left,e.clientY-r.top);
  if(i>=0)select(S.nodes[i],false);

cv.addEventListener("dblclick",function(e){

  if(i>=0){S.focus=S.nodes[i];renderGraph(true);}

cv.addEventListener("wheel",function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect();var mx=e.clientX-r.left,my=e.clientY-r.top;
  var k=e.deltaY<0?1.12:1/1.12;
  var w=toWorld(mx,my);
  G.scale=Math.min(4,Math.max(0.15,G.scale*k));
  G.tx=mx-w.x*G.scale;G.ty=my-w.y*G.scale;

function fitView(){
  if(!S.nodes.length)return;
  var W=cv.clientWidth,H=cv.clientHeight;
  var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  G.pos.forEach(function(p){minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y);});
  var w=Math.max(maxx-minx,1),h=Math.max(maxy-miny,1);
  G.scale=Math.min(2.0,Math.max(0.1,Math.min(W/(w+190),H/(h+190))));
  G.tx=W/2-((minx+maxx)/2)*G.scale-18;
  G.ty=H/2-((miny+maxy)/2)*G.scale-12;
}

/* ---------- 关系链（BFS） ---------- */
function bfsPath(si,ti){
  if(si===ti)return [];
  var prev=new Array(P.length).fill(-1);
  var via=new Array(P.length).fill(null);
  var vis=new Array(P.length).fill(false);
  var q=[si];vis[si]=true;
  var head=0;
  while(head<q.length){
    var cur=q[head++];
    if(cur===ti)break;
    var edges=ADJ[cur].filter(function(e){return passType(e.t);});
    // 优先扩展高知名度（度数高）节点，使路径更"有意义"
    edges.sort(function(a,b){return b.o.deg-a.o.deg;});
    for(var i=0;i<edges.length;i++){
      var nb=edges[i].o.i;
      if(vis[nb])continue;
      vis[nb]=true;prev[nb]=cur;via[nb]=edges[i];
      q.push(nb);
      if(nb===ti){head=q.length;break;}
    }
  }
  if(!vis[ti])return null;
  var path=[],cur2=ti;
  while(cur2!==si){path.unshift({from:P[prev[cur2]],rel:via[cur2],to:P[cur2]});cur2=prev[cur2];}
  return path;
}
function renderChain(){
  var out=document.getElementById("path-out");
  var an=document.getElementById("ca").value.trim();
  var bn=document.getElementById("cb").value.trim();
  var a=BY_NAME[an],b=BY_NAME[bn];
  if(!a||!b){out.innerHTML='<div class="path" style="color:var(--ink3)">请输入两位人物的准确姓名（可从人物库中点选复制）</div>';return;}
  var path=bfsPath(a.i,b.i);
  var html="";
  function card(p){return '<div class="pcard" data-g="'+p.i+'"><b>'+esc(p.name)+'</b><span>'+esc(p.dyn)+'</span></div>';}
  if(path&&path.length){
    html+='<div class="path"><div class="path-title">关系链（'+path.length+' 步）</div><div class="node-row">'+
      card(a)+path.map(function(s){
        return '<span style="color:var(--ink3)">→</span>'+card(s.to);
      }).join("")+'</div>'+
      path.map(function(s){
        return '<div class="link-mid"><span class="rt">'+esc(s.rel.t)+'</span>'+
          '<b>'+esc(s.from.name)+'</b> 与 <b>'+esc(s.to.name)+'</b>：'+esc(s.rel.d)+'</div>';
      }).join("")+'</div>';
    // 备选路径：移除第一段边后重算
    var alt=null;
    if(path.length>1){
      var ban=new Set([path[0].rel]);
      var prevRels=RELS;
      var saved=RELS;
      RELS=RELS.filter(function(r){return !ban.has(r);});
      var ADJ2=ADJ;
      // 临时重建邻接
      var tmpADJ=P.map(function(){return [];});
      RELS.forEach(function(r){if(passType(r.t)){tmpADJ[r.a.i].push({o:r.b,t:r.t,d:r.d,r:r});tmpADJ[r.b.i].push({o:r.a,t:r.t,d:r.d,r:r});}});
      var oldADJ=ADJ;ADJ=tmpADJ;
      alt=bfsPath(a.i,b.i);
      ADJ=oldADJ;RELS=saved;
    }
    if(alt&&alt.length){
      html+='<div class="path" style="opacity:.9"><div class="path-title" style="font-size:13px;color:var(--ink2)">另一条路径（'+alt.length+' 步）</div><div class="node-row">'+
        card(a)+alt.map(function(s){return '<span style="color:var(--ink3)">→</span>'+card(s.to);}).join("")+'</div></div>';
    }
  }else if(path){
    html+='<div class="path">'+esc(a.name)+' 与 '+esc(b.name)+' 是同一人</div>';
  }else{
    html+='<div class="path"><div class="path-title" style="color:var(--ink2)">未找到关系链</div>'+
      '在当前关系类型筛选下，这两位人物之间没有可连通的路径。可尝试取消关系类型筛选。</div>';
  }
  // 共同关联人
  var ca=new Set(ADJ[a.i].map(function(e){return e.o.i;}));
  var common=ADJ[b.i].map(function(e){return e.o;}).filter(function(p){return ca.has(p.i)&&p.i!==a.i&&p.i!==b.i;});
  if(common.length){
    html+='<div class="path"><div class="path-title" style="font-size:13px;color:var(--ink2)">共同关联人物（'+common.length+'）</div><div class="common">'+
      common.slice(0,24).map(card).join("")+'</div></div>';
  }
  out.innerHTML=html;
  Array.prototype.forEach.call(out.querySelectorAll("[data-g]"),function(el){
    el.onclick=function(){var p=P[+el.dataset.g];S.view="graph";switchView("graph");S.focus=p;select(p,true);};
  });
}

/* ---------- 年代长卷 ---------- */
var cv2=document.getElementById("cv2"),TL={bars:[],y0:0,rowH:11};
function drawTimeline(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var W=cv2.clientWidth,H=cv2.clientHeight;
  var list=P.filter(passFilter).slice().sort(function(a,b){return a.b-b.b;});
  // 时间轴范围随当前人物集合自适应：人数少时自动放大小时段
  var MIN=-1200,MAX=1960;
  if(list.length){
    var m0=1e9,m1=-1e9;
    list.forEach(function(p){m0=Math.min(m0,p.b);m1=Math.max(m1,p.d);});
    var padv=Math.max((m1-m0)*0.05,30);
    var st0=(m1-m0)>1500?100:((m1-m0)>500?50:20);
    MIN=Math.floor((m0-padv)/st0)*st0;MAX=Math.ceil((m1+padv)/st0)*st0;
    if(MAX-MIN<80){MAX=MIN+80;}
  }
  var padL=92,padR=60,padT=42;
  // 人数少时撑满视野；人数多时固定可读行高，靠滚动浏览（不压缩到看不清）
  var rowH=list.length<=Math.floor((H-padT-20)/12)
      ? Math.max(12,Math.min(24,Math.floor((H-padT-20)/Math.max(list.length,1)))) : 13;
  var totalH=Math.max(H,padT+list.length*rowH+20);
  cv2.width=W*dpr;cv2.height=totalH*dpr;
  cv2.style.height=totalH+"px";
  var g=cv2.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,totalH);
  g.fillStyle="#fffdf7";g.fillRect(0,0,W,totalH);
  function X(y){return padL+(y-MIN)/(MAX-MIN)*(W-padL-padR);}
  // 朝代分隔带（按当前人物的时代分组连续段着色）
  g.font="11px 'Source Han Serif SC',serif";
  // 时间刻度
  g.strokeStyle="#e6dfcd";g.lineWidth=1;g.fillStyle="#8b8477";g.textAlign="center";g.textBaseline="top";
  var span=MAX-MIN,step=span>2400?200:(span>1200?100:(span>500?50:(span>200?20:10)));
  for(var y=Math.ceil(MIN/step)*step;y<=MAX;y+=step){
    var x=X(y);
    g.beginPath();g.moveTo(x,padT-8);g.lineTo(x,totalH-10);g.stroke();
    g.fillText(y<0?"前"+(-y):(y===0?"公元元":y),x,20);
  }
  g.fillStyle="#8b8477";g.textAlign="left";g.font="11px sans-serif";
  g.fillText("← 横向为年代，"+(MIN<0?"前"+(-MIN):MIN)+" — "+MAX+" 年，每条横线代表一位人物的生卒区间 →",padL,4);
  if(totalH>H+20){
    g.textAlign="right";g.fillStyle="#a88";
    g.fillText("共 "+list.length+" 人，向下滚动查看全部",W-padR,4);
  }
  TL.bars=[];
  list.forEach(function(p,i){
    var yy=padT+i*rowH;
    var x1=X(p.b),x2=X(Math.max(p.d,p.b+1));
    var w=Math.max(x2-x1,2);
    var hiRow=(S.sel&&S.sel.i===p.i);
    g.fillStyle=p.color;g.globalAlpha=hiRow?1:0.72;
    g.beginPath();
    var rr=Math.min(rowH/2-1,4);
    g.roundRect?g.roundRect(x1,yy,w,Math.max(rowH-3,4),rr):g.rect(x1,yy,w,Math.max(rowH-3,4));
    g.fill();
    if(hiRow){g.globalAlpha=1;g.strokeStyle="#a83232";g.lineWidth=1.5;g.strokeRect(x1-1,yy-1,w+2,Math.max(rowH-3,4)+2);}
    g.globalAlpha=1;
    if(rowH>=11){
      g.fillStyle=hiRow?"#a83232":"#6b6353";g.font="10px 'Source Han Serif SC',serif";
      g.textAlign="right";g.textBaseline="middle";
      g.fillText(p.name,padL-6,yy+rowH/2-1);
    }
    TL.bars.push({name:p.name,x:x1,y:yy,w:w,h:Math.max(rowH-3,4),p:p});
  });
  // 仅在人物集合本身变化时回到顶部，选中某人不打断浏览位置
  var _sig=list.length+"|"+(list.length?list[0].i:"")+"|"+(list.length?list[list.length-1].i:"");
  if(TL.sig!==_sig){document.getElementById("v-time").scrollTop=0;TL.sig=_sig;}
  return totalH;
}

/* ---------- 人物库 ---------- */
function renderList(){
  var list=P.filter(passFilter).slice();
  var key=S.sortKey;
  list.sort(function(a,b){
    var va,vb;
    if(key===0){va=a.name;vb=b.name;return S.sortAsc?va.localeCompare(vb,"zh"):vb.localeCompare(va,"zh");}
    if(key===1){va=a.alias;vb=b.alias;}
    else if(key===2){va=a.b;vb=b.b;}
    else if(key===3){va=a.role;vb=b.role;}
    else {va=a.b;vb=b.b;}
    if(typeof va==="string")return S.sortAsc?va.localeCompare(vb,"zh"):vb.localeCompare(va,"zh");
    return S.sortAsc?va-vb:vb-va;
  });
  var per=60,pages=Math.max(1,Math.ceil(list.length/per));
  if(S.page>=pages)S.page=0;
  var page=list.slice(S.page*per,S.page*per+per);
  var tb=document.querySelector("#tb tbody");
  tb.innerHTML=page.map(function(p){
    return "<tr><td class='nm' data-g='"+p.i+"'>"+esc(p.name)+"</td><td>"+esc(p.alias)+"</td>"+
      "<td><span class='tag' style='background:"+p.color+"22'>"+esc(p.dyn)+"</span></td>"+
      "<td>"+esc(p.role)+"</td><td class='yr'>"+life(p)+"</td>"+
      "<td style='color:var(--ink2)'>"+esc(p.desc)+"</td></tr>";
  }).join("");
  Array.prototype.forEach.call(tb.querySelectorAll("[data-g]"),function(el){
    el.onclick=function(){select(P[+el.dataset.g],true);};
  });
  var pg=document.getElementById("pg");
  pg.innerHTML='<button id="pPrev">上一页</button><span>第 '+(S.page+1)+' / '+pages+' 页 · 共 '+list.length+' 人</span><button id="pNext">下一页</button>';
  document.getElementById("pPrev").onclick=function(){if(S.page>0){S.page--;renderList();}};
  document.getElementById("pNext").onclick=function(){if(S.page<pages-1){S.page++;renderList();}};
  Array.prototype.forEach.call(document.querySelectorAll("#tb th"),function(th){
    th.onclick=function(){

      if(S.sortKey===k)S.sortAsc=!S.sortAsc;else{S.sortKey=k;S.sortAsc=true;}
      renderList();

  });
}

function showSuggest(){
  var q=S.q.toLowerCase();
  if(!q){sg.style.display="none";return;}
  var hits=P.filter(function(p){
    return (p.name+p.alias+p.dyn+p.role).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){
    var an=a.name.indexOf(S.q)>=0?0:1,bn=b.name.indexOf(S.q)>=0?0:1;
    return an-bn||b.deg-a.deg;
  }).slice(0,20);
  if(!hits.length){sg.style.display="none";return;}
  sg.innerHTML=hits.map(function(p){
    return '<div data-g="'+p.i+'">'+esc(p.name)+'<span class="s-meta">'+esc(p.dyn)+' · '+esc(p.role)+'</span></div>';
  }).join("");
  sg.style.display="block";
  Array.prototype.forEach.call(sg.children,function(el){
    el.onclick=function(){
      sg.style.display="none";qEl.value="";S.q="";
      S.focus=P[+el.dataset.g];
      switchView("graph");select(P[+el.dataset.g],true);
    };
  });
}
document.addEventListener("click",function(e){
  if(!e.target.closest("#search"))sg.style.display="none";
});

/* ---------- 工具按钮 ---------- */
document.getElementById("btn-fit").onclick=function(){fitView();};
document.getElementById("btn-expand").onclick=function(){
  if(S.sel){S.focus=S.sel;renderGraph(true);}
};
document.getElementById("btn-all").onclick=function(){
  S.focus=null;renderGraph(true);
};
document.getElementById("btn-freeze").onclick=function(){S.frozen=!S.frozen;};
document.getElementById("btn-png").onclick=function(){
  var c=document.createElement("canvas");
  var W=cv.clientWidth,H=cv.clientHeight,dpr=2;
  c.width=W*dpr;c.height=H*dpr;
  var g=c.getContext("2d");
  g.fillStyle="#f6f3ea";g.fillRect(0,0,W*dpr,H*dpr);
  g.drawImage(cv,0,0,W*dpr,H*dpr);
  var a=document.createElement("a");
  a.download="人物关系图.png";a.href=c.toDataURL("image/png");a.click();
};
document.getElementById("ck-label").onchange=function(){S.showLabel=this.checked;};
document.getElementById("ck-edge").onchange=function(){G.showEdge=this.checked;};
document.getElementById("lg-t").onclick=function(){
  var b=document.getElementById("lg-body");
  var hide=b.style.display!=="none";
  b.style.display=hide?"none":"block";
  document.getElementById("lg-a").textContent=hide?"▸":"▾";
};
document.getElementById("sp").oninput=function(){
  G.spread=this.value/100;
  // 不重置布局，仅重新加温，让图自然舒展/收拢
  G.alpha=Math.max(G.alpha,0.55);
  G.tick=Math.min(G.tick,240);
};
document.getElementById("btn-path").onclick=renderChain;
document.getElementById("btn-random").onclick=function(){
  var a=P[Math.floor(Math.random()*P.length)],b=P[Math.floor(Math.random()*P.length)];
  var guard=0;
  while((a.i===b.i||a.era===b.era)&&guard++<60){b=P[Math.floor(Math.random()*P.length)];}
  document.getElementById("ca").value=a.name;document.getElementById("cb").value=b.name;
  renderChain();
};
["ca","cb"].forEach(function(id){
  var el=document.getElementById(id);
  el.addEventListener("keydown",function(e){if(e.key==="Enter")renderChain();});
});

/* ---------- 总渲染 ---------- */
function renderAll(){
  renderSideList();
  if(S.view==="graph")renderGraph(true);
  else if(S.view==="list")renderList();
  else if(S.view==="time")drawTimeline();
  else renderChain();
  var n=P.filter(passFilter).length;
  document.getElementById("stat").textContent="共收录 "+P.length+" 位人物 · "+RELS.length+" 条关系（当前筛选 "+n+" 人）";
}
window.addEventListener("resize",function(){
  if(S.view==="graph"){draw();}
  if(S.view==="time")drawTimeline();
});

/* ---------- 启动 ---------- */
buildFilters();
document.getElementById("ca").value="李白";
document.getElementById("cb").value="曹操";
S.sel=BY_NAME["曹操"]||P[0];
S.focus=S.sel;
renderDetail();
renderSideList();
document.getElementById("stat").textContent="共收录 "+P.length+" 位人物 · "+RELS.length+" 条关系";
renderGraph(true);
var _h=(typeof location!=="undefined"&&location.hash?location.hash:"").replace("#","");
if(_h==="chain"||_h==="time"||_h==="list")switchView(_h);
if(badRel.length)console.warn("已忽略无效关系:",badRel);
</script>
